# Fichier : k8s/overlays/prod/kustomization.yaml
# Prod : l'InferenceService du Lab 5 (namespace scoring), repris par Argo CD.
# Une mise en production = UN commit qui change newName/newTag ci-dessous ET la part du
# canary dans canary.yaml (python -m pipelines.gitops deploy --env prod --canary 10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scoring
resources:
  - ../../base
images:
  - name: scoring-api
    newName: localhost:5001/scoring-api
    newTag: "2.0.0"
patches:
  - path: canary.yaml
  # Lab 8 : identité minimale de l'API (ServiceAccount de k8s/rbac-scoring.yaml, appliqué
  # avant ce commit). En prod seulement : scoring-sa n'existe que dans le namespace scoring.
  # Dans Git, pas par kubectl patch : Argo CD (selfHeal) annulerait la modification.
  - target:
      kind: InferenceService
      name: scoring-model
    patch: |-
      - op: add
        path: /spec/predictor/serviceAccountName
        value: scoring-sa
